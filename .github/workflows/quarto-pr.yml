name: Quarto PR build
on:
  pull_request:
  push:
    branches-ignore:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.39
      - name: Render
        run: quarto render
      - uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: _site
